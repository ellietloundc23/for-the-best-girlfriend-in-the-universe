<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la mejor novia del universo ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 650px;
            width: 100%;
            z-index: 10;
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ff758c;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        p.subtitle {
            font-size: 1.05rem;
            margin-bottom: 25px;
            color: #ddd;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff758c;
        }

        .time-box label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .rng-section {
            background: rgba(0, 0, 0, 0.25);
            padding: 25px;
            border-radius: 15px;
            border: 1px dashed rgba(255, 117, 140, 0.4);
            margin-top: 20px;
        }

        .rng-title {
            font-size: 1.4rem;
            color: #ffb199;
            margin-bottom: 10px;
        }

        .counter-tracker {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 15px;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: all 0.3s ease;
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .reward-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .rarity-tag {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .reward-text {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .common { border-color: #a0a0a0; }
        .common .rarity-tag { background: #666; color: #fff; }

        .rare { border-color: #4facfe; box-shadow: 0 0 10px rgba(79, 172, 254, 0.3); }
        .rare .rarity-tag { background: #00f2fe; color: #000; }

        .epic { border-color: #b224ef; box-shadow: 0 0 15px rgba(178, 36, 239, 0.4); }
        .epic .rarity-tag { background: #b224ef; color: #fff; }

        .legendary { border-color: #f9d423; box-shadow: 0 0 20px rgba(249, 212, 35, 0.6); animation: pulse 1.5s infinite alternate; }
        .legendary .rarity-tag { background: #f9d423; color: #000; }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 20px;
            color: #ff758c;
            animation: float 6s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
